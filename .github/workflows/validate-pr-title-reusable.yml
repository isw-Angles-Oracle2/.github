name: PR Title JIRA Validation

on:
  workflow_call:
    inputs:
      pr_title:
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: PR Title JIRA Validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          echo "Validating PR title: '$PR_TITLE'"

          if echo "$PR_TITLE" | grep -Eq '^(ANGO-[0-9]+|\[ANGO-[0-9]+\])(\s*:\s*.*)?$'; then
            echo "✅ PR title is valid."
          else
            echo "❌ PR title must start with ANGO-1234 or [ANGO-1234], optionally followed by ':' and description."
            exit 1
          fi

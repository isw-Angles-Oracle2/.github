name: Claude PR Review (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a security review of this pull request's changes only.
            Look for: injection (SQL, command, template), hard-coded secrets or
            credentials, broken authentication/authorization, unsafe
            deserialization, path traversal, insecure cryptography, missing
            input validation, sensitive data in logs, and risky new dependencies.

            For each finding give severity (High/Medium/Low), file and line,
            why it is exploitable, and a concrete fix. Post line-specific
            findings as inline comments and a short summary as a PR comment.
            If there are no security issues, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  duplication-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for code duplication. Check whether the
            new or changed code (a) repeats logic already present elsewhere in
            the repository, (b) re-implements an existing helper, utility, or
            shared module, or (c) contains copy-pasted blocks within the PR
            itself.

            For each finding, name the duplicated locations (file and line),
            and suggest the existing code to reuse or a refactor to extract
            shared logic. Post line-specific findings as inline comments and a
            short summary as a PR comment. If there is no meaningful
            duplication, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git grep:*)"
